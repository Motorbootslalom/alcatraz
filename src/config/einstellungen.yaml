# =====================================================================
# Einstellungen für alle Aufbauten
# =====================================================================
# Wird von `npm run config:sync` mit den anderen Dateien zu public/config/positionen.yaml
# zusammengeführt. Parameter: siehe src/config/aufbauten.yaml.

# ---- Globale Bojen-Kürzel (an EINER Stelle umstellbar) -------------
# In "sub" und Hinweisen werden diese Tokens (als ganze Wörter) ersetzt.
# So wird aus "hin seiteA" -> "H R". Alternativen:
#   Hafen/Kai:    seiteA: H,  seiteB: K
#   Land/See:     seiteA: L,  seiteB: S
#   Rechts/Links: seiteA: R,  seiteB: L   (Standard)
bezeichnungen:
  hin: "H"           # 1. Zeichen: Hinfahrt
  rueck: "R"         # 1. Zeichen: Rückfahrt (R = Rückfahrt; "R R" = Rück + Rechts ist ok)
  seiteA: "R"        # 2. Zeichen: eine Bojen-Seite (Standard: Rechts)
  seiteB: "L"        # 2. Zeichen: andere Bojen-Seite (Standard: Links)
  seiteAlang: "Rechts"  # Langname (für den Hinweis-Text)
  seiteBlang: "Links"
  iahinweis: ""         # nur im Schema "Innen/Außen" mit Text gefüllt

# ---- Auf der Seite umschaltbare Beschriftung (Bojen-Seiten) ---------
# Wird eines gewählt, überschreiben seine tokens die bezeichnungen oben und
# alle Listen werden neu beschriftet. Das erste ist der Standard.
beschriftungen:
  - id: rl
    name: "Rechts / Links (R/L)"
    tokens: { seiteA: "R", seiteB: "L", seiteAlang: "Rechts", seiteBlang: "Links" }
  - id: ls
    name: "Land / See (L/S)"
    tokens: { seiteA: "L", seiteB: "S", seiteAlang: "Land", seiteBlang: "See" }
  - id: sl
    name: "See / Land (S/L)"
    tokens: { seiteA: "S", seiteB: "L", seiteAlang: "See", seiteBlang: "Land" }
  - id: kh
    name: "Kai / Hafen (K/H)"
    tokens: { seiteA: "K", seiteB: "H", seiteAlang: "Kai", seiteBlang: "Hafen" }
  - id: pfeile
    name: "Pfeile (→ / ←)"
    raeumlich: true   # Pfeile zeigen eine Bildrichtung → an "von hinten"-Positionen spiegeln
    tokens: { seiteA: "→", seiteB: "←", seiteAlang: "Rechts", seiteBlang: "Links" }
  # Innen/Außen ist TOR-relativ: die Tore 1-4 tragen ihre innen/aussen-Kürzel
  # (aus der `innen`-Markierung der Spalten), Tor 5/Start/Ziel bleiben bei R/L.
  - id: ia
    name: "Innen / Außen (I/A)"
    tokens:
      seiteA: "R"
      seiteB: "L"
      seiteAlang: "Rechts"
      seiteBlang: "Links"
      innen: "I"
      aussen: "A"
      iahinweis: "Tore 1-4: I = Innen, A = Außen (statt R/L; Tor 5/Start/Ziel bleiben R/L)"

# ---- Wiederverwendbare Hinweise (Bojen-Bezeichnungen) --------------
hinweise:
  blickrichtung: |-
    Bojen-Bezeichnung (eindeutig):
    1. Zeichen = Fahrtrichtung: hin = Hinfahrt, rueck = Rückfahrt
    2. Zeichen = Seite: seiteA = seiteAlang, seiteB = seiteBlang
    iahinweis
    Start = Berührung Einfahrt-Bojentor · Ziel = Berührung Ausfahrt-Bojentor (je nur Seite)
    Fehler: pro berührter Boje (auch außerhalb des Manövers) = 5
  knoten: "Fehler: 5 pro fehlerhafter Knoten"
  parcours: "Es ist nur der eigentliche Fahrweg zu beobachten - keine Bojenberührungen!"

# ---- Überwachung: Was muss in jedem Aufbau auf einer Liste stehen? -
# `npm run config:check` prüft je Aufbau und Klasse, ob jede Boje und jede Aufgabe
# von einer Liste abgedeckt ist, auch mit zusammengelegten Positionen. `fahrweg` leitet
# das aus dem Fahrweg ab (src/config/kurzform.ts): jeder Halt mit seinen Klassen, dazu
# Ablegen und Anlegen. Eine eigene Liste geht weiterhin:
#   - { name: …, key: …, sub: [hin seiteA, …] }   Bojen-Spalte und ihre Bojen
#   - { name: …, katalog: … }                      eine Fehler-Spalte mit diesem Katalog
#   klassen: [ … ]                                 nur für diese Klassen (fehlt = alle)
ueberwachung: fahrweg

# ---- Laufzettel (je Klasse/Lauf) ----------------------------------
# Unter den Checkboxen je gedruckter Seite folgen diese Arbeitsschritte der
# Auswertung, jeweils mit eigener Checkbox (Reihenfolge wie hier).
# Das ist die Vorgabe. Die Schritte hängen am Regelwerk: Ein Regelwerk (regelwerke/<id>.yaml)
# darf mit einem eigenen Abschnitt `laufzettel` abweichen – jede Angabe dort (`titel`,
# `schritte`, `schritteLetzterLauf`) ersetzt die gleichnamige hier. Ein Schritt ist ein Text
# oder `{ text, en }`, wenn das Regelwerk den englischen Wortlaut vorgibt.
laufzettel:
  titel: "Auswertung"
  schritte:
    - "Wertungsliste sortiert nach Startnummer drucken (geheftet mit den WKR-Listen)"
    - "Wertungsliste sortiert nach Platz"
    - "Kontrolliert"
    - "Unterschrieben"
    # `zwischenaushang: true`: Der Schritt gehört zum Aushang zwischen den Läufen. Werden die
    # Läufe direkt nacheinander gefahren (Schalter der Veranstaltung, nur unter Regelwerken mit
    # `versucheNacheinander`, z. B. UIM 960 Pkt. 4.3.2), entfällt er auf den Zetteln vor dem
    # letzten Lauf – ausgehängt wird dann erst das Ergebnis nach dem letzten.
    - { text: "Ausgehangen", zwischenaushang: true }
    - { text: "An die ML geschickt", zwischenaushang: true }
  # Der Zettel des letzten Laufs (bei nur einem Lauf: dieser) hat eigene Schritte. DM-Reglement
  # C6 „Auswertung“: „Die Auswertungen zum Lauf 1 und 2 werden für alle sichtbar ausgehangen.
  # Die Auswertung Lauf 3 kann nur vom Mannschaftsleiter nach Aufruf eingesehen werden.“ Der
  # letzte Lauf wird also nicht mehr ausgehängt, die Mannschaftsleiter sehen ihn nur ein;
  # danach folgt das Gesamtergebnis. (Bei nur zwei Läufen behandelt das Programm den zweiten
  # als letzten – Vorgabe des Veranstalters; das Reglement nennt Lauf 1 und 2 als Aushang.)
  # Die Protestfrist (C7: schriftlich, spätestens ½ Stunde nach eingeräumter Möglichkeit der
  # Sichtung der Wertungsliste) hat keinen eigenen Schritt. Auf diesem Zettel stehen auch die
  # Knoten – sie zählen erst zum Gesamtergebnis. Fehlt die Angabe, gelten die Schritte oben.
  schritteLetzterLauf:
    - "Wertungsliste sortiert nach Startnummer drucken (geheftet mit den WKR-Listen)"
    - "Wertungsliste sortiert nach Platz"
    - "Kontrolliert"
    - "Unterschrieben"
    - "Einsicht der Mannschaftsleiter (kein Aushang)"
    - "Gesamtergebnis gedruckt"
    - "Gesamtergebnis kontrolliert"

# ---- Mannschaftswertung je Herkunft (im Code „pokal“) --------------
# Punkte je Platz der Gesamtliste einer Klasse, für die beiden Varianten, die es in jedem
# Regelwerk gibt. Es sind Vorgaben: Unter „Einstellungen → Mannschaftswertung“ lassen sich die
# Punkte ändern; die Zahl der Plätze (3 bzw. 6) steht mit der Länge der Liste fest.
#   plaetze3   die ersten drei Plätze je Klasse: 10, 7, 5 Punkte
#   plaetze6   die ersten sechs Plätze je Klasse: 6, 5, 4, 3, 2, 1 Punkte (so rechnet die
#              Excel-Mappe der DM 2026, Blatt „Eingaben“, „Punkte für Platz“; im DM-Reglement
#              steht diese Wertung nicht – C6 kennt nur die Länderwertung nach UIM-Punkten)
# Die dritte Variante (`uim`: Punkte für die Plätze 1 bis 20, je Herkunft zählen die fünf
# Besten) steht mit ihrer Tabelle im Regelwerk der UIM (regelwerke/uim-2026.yaml, `pokal.uim`).
# Welche Varianten eine neue Veranstaltung eingeschaltet hat, sagt das Regelwerk (`pokal.vorgabe`).
# Der Block heißt hier `pokalPunkte`, damit er sich mit dem `pokal` des Regelwerks nicht überdeckt.
pokalPunkte:
  plaetze3: [10, 7, 5]
  plaetze6: [6, 5, 4, 3, 2, 1]

# ---- Startabstände je Klasse (Betrieb am Wettkampftag) --------------
# Abstand zweier Starts auf der Anzeigetafel in ganzen Sekunden (30 bis 600): Fahrzeit plus
# Bootswechsel am Steg. Grundlage der Wartezeit in der Startliste und der Zuschauerliste („ca. in“,
# „Zeit bis zum Vorsteg“), solange in der Veranstaltung weniger als drei Abstände der Klasse
# gemessen sind (betrieb/prognose.ts, BETRIEB_ANNAHMEN.prognoseMessung). Es gilt, der Reihe nach:
# der eigene Wert der Veranstaltung (Einstellungen → Betrieb, auch „Messwerte als Vorgabe
# übernehmen“), sonst `startabstaende` des Regelwerks (ersetzt je Klasse), sonst der Wert hier
# (config/catalog.ts startabstandOf). Unter UIM gilt bis zur Messung ebenfalls der Wert hier
# (Plan zur Übernahme der Tafel vom 16.11.2026, §7 Nr. 12).
# Beleg (übernommen am 16.11.2026 aus dem Tafel-Prototyp, Herleitung dort in data/timings.ts):
# die Ergebnislisten der Deutschen Meisterschaft 2025, Gesamtblätter je Klasse, „gef. Zeit“ aller
# drei Läufe – die mittlere Fahrzeit je Klasse plus 30 s für den Bootswechsel, auf 5 s gerundet
# (genauer ist die Zahl nicht, der Zuschlag ist geschätzt). Läufe, die nicht durchgefahren wurden
# (Platzhalter für Abbrüche), sind nicht eingeflossen. Hier stehen bewusst nur die gerundeten
# Mittel, keine Einzelzeiten. Klasse 1 fährt am schnellsten, danach wird es klassenweise langsamer;
# Klasse E fällt heraus – kurze Bahn, aber mehr Zeit am Steg (Lastenheft der Tafel, L-3).
startabstaende: { E: 120, 1: 110, 2: 115, 3: 120, 4: 120, 5: 135, 6: 135, 7: 140 }
