# =====================================================================
# Aufbau Parallelslalom
# =====================================================================
# Wird von `npm run config:sync` mit den anderen Dateien zu public/config/positionen.yaml
# zusammengeführt. Parameter: siehe src/config/aufbauten.yaml.

aufbauten:
  - id: parallel
    name: Parallelslalom
    positionen: [zeit, steg, parallelparcours]
    eigeneStrecke: true   # eigene Bojen, der Überwachungs-Check gilt hier nicht
    disziplin: parallel   # eigene Eingaben: bleiben beim Wechsel zu Manövrieren und zurück
    # Die Steg-Liste (pontoon) hat hier keine Spalte „Bemerkung“ (Entscheidung des Nutzers vom
    # 15.11.2026): Der Platz geht an die übrigen Spalten. Unter dem Manövrieren bleibt sie.
    ohneSpalten:
      steg: [bemerkung]

disziplinen:
  - id: parallel
    name: Parallelslalom
    # Start und Ziel mit je einer Spalte für die linke und die rechte Boje (L, R), wie die Tore
    # der Wertungsliste im Manövrieren (Entscheidung des Nutzers vom 15.11.2026).
    ergebnisspalten:
      - { label: "Steg AB", felder: ["katalog:stegAblegen"] }
      - { label: "Start", unter: ["start|seiteB", "start|seiteA"] }
      # Die Bojen unter EINER Überschrift „Boje“, die Nummern darunter – wie „Start“ über L und R
      # (Wunsch des Nutzers vom 21.11.2026: „Boje über den Zahlen, im Prototypen war das besser“).
      - label: "Boje"
        unter:
          - { feld: b1a, label: "1" }
          - { feld: b2a, label: "2" }
          - { feld: b3a, label: "3" }
          - { feld: b4a, label: "4" }
          - { feld: b5, label: "5" }
          - { feld: b4b, label: "4" }
          - { feld: b3b, label: "3" }
          - { feld: b2b, label: "2" }
          - { feld: b1b, label: "1" }
      - { label: "Ziel", unter: ["ziel|seiteB", "ziel|seiteA"] }
      - { label: "Steg AN", felder: ["katalog:stegAnlegen"] }

positionen:
  - id: parallelparcours
    titel: "Parallelslalom"
    menue: "Parallelslalom (nur Fahrweg)"
    disq: parcours
    # Σ wie auf den Fahrweg-Listen des Manövrierens mit Bojen (Parcours mit Start und Ziel):
    # hinter „Disq.“, die Summe der Fehlerpunkte der Zeile (Entscheidung des Nutzers vom 15.11.2026).
    summeSpalte: sum
    # Start und Ziel: die linke und die rechte Boje je in eigener Zelle, durchgezogen getrennt –
    # genau erkennbar, welche berührt wurde (Entscheidung des Nutzers vom 15.11.2026; vorher
    # beide in einer Zelle „L R“).
    spalten:
      - { key: start, label: "Start", typ: boje, sub: ["seiteB", "seiteA"], subTrenner: linie }
      - { key: b1a, label: "Boje 1", typ: boje }
      - { key: b2a, label: "Boje 2", typ: boje }
      - { key: b3a, label: "Boje 3", typ: boje }
      - { key: b4a, label: "Boje 4", typ: boje }
      - { key: b5, label: "Boje 5", typ: boje }
      - { key: b4b, label: "Boje 4", typ: boje }
      - { key: b3b, label: "Boje 3", typ: boje }
      - { key: b2b, label: "Boje 2", typ: boje }
      - { key: b1b, label: "Boje 1", typ: boje }
      - { key: ziel, label: "Ziel", typ: boje, sub: ["seiteB", "seiteA"], subTrenner: linie }
      - { key: disq, label: "Disq.", typ: disq }
      - { key: sum, label: "Σ", typ: summe }
