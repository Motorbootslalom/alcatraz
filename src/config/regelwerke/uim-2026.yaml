# =====================================================================
# Regelwerk UIM 2026 (Formula Future)
# =====================================================================
# Quelle: UIM Circuit Rulebook 2026, Regel 960 „Formula Future“. Die Strafen
# stehen in Pkt. 5.3 (S. 287), die Knoten in Pkt. 4.3.1 und auf S. 288.
# Felder: siehe dm-2026.yaml.
#
# Die englischen Texte (`en`) folgen wörtlich Pkt. 5.3, einschließlich der dort
# verwendeten Begriffe („safety belt“ für den Rettungsring). Korrigiert ist nur
# eine doppelte Verneinung (Code 18). Die Titel der Steg-Kataloge folgen Pkt. 4.1 („right from
# the moment of leaving the starting pontoon“) und Pkt. 4.1.1 („Mooring: After passing the
# finishing line a boat must approach the mooring pontoon …“) – ohne die deutschen Kürzel AB
# und AN. Die deutschen Texte sind Übersetzungen.
#
# Codes mit gleicher Bedeutung tragen dieselbe Nummer wie in der DM. Fehler, die
# die UIM nicht kennt (Durchreißen der Schaltung, Treten auf den Schlauch,
# Festmacherleine, kein Leerlauf), fehlen hier, die Nummern bleiben frei.
id: uim-2026
name: UIM
version: 2026
# Listen und Fehlertexte wahlweise deutsch, englisch oder zweisprachig.
sprachen: [de, en]
# Die UIM schreibt englisch aus: Alle Listen außer den Wettkampfrichter-Bögen (Starter-,
# Gewichts-, Vorsteg- und Wertungslisten, Laufzettel, Aushang der Codes) stehen englisch,
# gleich in welcher Sprache die Oberfläche bedient wird. Für die Bögen ist es die Vorgabe;
# dort lässt sich je Liste deutsch, englisch oder zweisprachig wählen.
listenSprache: en
# Länder auf den Listen mit dem Kürzel des IOC (GER, SUI, NED, LAT), nicht nach ISO (DEU, CHE …):
# Regel 209 „POSTING OF THE RESULTS“ – „The nationality of all drivers – either by using a three
# letter abbreviation for the countries worldwide as listed by the IOC or as full names of the
# nations in English language.“
laenderKuerzel: ioc
quelle: "UIM Circuit Rulebook 2026, Regel 960 Formula Future, Pkt. 5.3 Penalties"
quelleEn: "UIM Circuit Rulebook 2026, rule 960 Formula Future, pt. 5.3 Penalties"
einheit: Sekunden
einheitEn: seconds
# Formula Future kennt nur Dolphin (hier: E) und die Klassen 1 bis 5.
klassen: [E, 1, 2, 3, 4, 5]
# Regel 960, Pkt. 1: „Class Dolphin ages 6 – 7 years“ – so heißt die jüngste Klasse im
# Regelwerk, und so steht sie überall (Listen, Bögen, Laufzettel, Erfassung, Auswahlfelder,
# Mannschaftswertung, Druckdatei), gleich in welcher Sprache die Oberfläche bedient wird.
klassenNamen: { E: Dolphin }
# Für die runden Marken der Oberfläche, in die der Name nicht passt.
klassenKurz: { E: D }
# Die Startnummern der Klasse behalten ihr „E“ (E01): Das Regelbuch nennt für Dolphin keine
# eigenen Nummern (Pkt. 3.7: „Each driver shall receive a personal number“). Soll sich das
# einmal ändern, genügt der Buchstabe hier – z. B. { E: D } für D01.
startNrPraefix: { E: E }
# Formula Future besteht aus Manövrieren und Parallelslalom.
disziplinen: [manoevrieren, parallel]
# Regel 960, Pkt. 3.7 Registration procedure, „Statistical average weight“. Die Werte
# weichen in den Klassen 1, 2, 4 und 5 von der DM ab.
gewichte: { E: 26, 1: 32, 2: 40, 3: 52, 4: 64, 5: 71 }
# Regel 960, Pkt. 2 „Boats, engines and equipment“: „A co-driver is mandatory for Classes
# Dolphin, 1 - 3. The experienced co-driver is to be provided by the organizer for each class
# and each stage. Within the same class is to be the same co-driver.“ Pkt. 3.7: Der Aushang
# nach der Registrierung nennt für diese Klassen auch den Namen des Co-Driver.
coPilot: [E, 1, 2, 3]
# Regel 960, Pkt. 5.2.6 „Dead-heat situations“, Manövrieren: „if two or more drivers have
# the same time in their best attempt (including knots and driving penalties), the driver
# with the better added attempt time (including penalties for both attempts) will be
# ranked higher. If one of the drivers has only one valid attempt, he/she will be ranked
# lower.“ Die Summe zählt die Versuche mit ihren Fahrstrafen, ohne die Knoten (sie gehören
# zu keinem Versuch). Für den einzelnen Versuch nennt die Regel keinen Stichentscheid.
stichentscheid: [summeAllerLaeufe]
# Regel 960, Pkt. 4.3 „Manoeuvring consists of: Tying knots (point 4.3.1); Driving on the
# manoeuvring racecourse (point 4.3.2)“ und Pkt. 5.2.1: Die Wertungsliste zeigt „knots test
# penalties“ und „best times including knots test penalties“. Die Knoten-Liste gehört deshalb
# zu jedem Aufbau des Manövrierens; ihre Strafsekunden zählen zum Gesamtergebnis. Für den
# Parallelslalom (Pkt. 4.4, 5.2.2) nennt die Regel keine Knoten.
vorgabeListen: { manoevrieren: [knoten] }
# Regel 960, Pkt. 4.3.2 (Manövrieren): „Each driver is allowed 2 attempts, run consecutively.
# […] Only the better attempt will be considered for the results (except of dead-heat
# situations).“ Also zwei Läufe, einer gestrichen – nur dann greift auch der Stichentscheid
# oben. Die Wahl des Regelwerks stellt die Veranstaltung so ein; wer von Hand abweicht,
# bekommt einen Hinweis.
wertungslaeufe: { laeufe: 2, streichlaeufe: 1 }
# Der Parallelslalom wird anders gewertet als das Manövrieren; was hier steht, gilt für ihn
# statt `stichentscheid` und `wertungslaeufe` oben (das Manövrieren folgt weiter jenen).
# Regel 960, Pkt. 4.4: „Each driver shall have two attempts - the drivers shall change boats
# and courses for the second attempt. Times from both attempts are counted up, adding penalty
# seconds (if any) and the driver is awarded UIM points for his/her ranking (point 317.01 ).“
# Also zwei Läufe (Attempts), keiner gestrichen: Es zählt die Summe. Pkt. 5.2.2: „If a
# disqualification occurs in parallel slalom, the driver concerned shall be disqualified from
# the whole stage because he/she does not have the required two valid attempts.“ – das folgt
# aus „keiner gestrichen“: Ein disqualifizierter Attempt lässt sich nicht streichen.
# Pkt. 5.2.6 „Dead-heat situations“: „Parallel slalom - if two or more drivers have the same
# added times from their two attempts (including penalties), the driver having the better
# single attempt time (including penalties) from either his/her first or second attempt will
# be ranked higher. If there is still a dead-heat situation and a decision is required in
# order to set up the semi-finals or finals, the drivers having the same time must re-run both
# attempts. After running again only the time of the re-run will be taken into account.“
# Also `besterLauf`; bleibt danach ein Gleichstand an der Grenze zum Weiterkommen, meldet ihn
# die Wertung des Vorlaufs und sperrt das Weiterkommen (lib/parallelErgebnis.ts).
wertungJeDisziplin:
  parallel:
    wertungslaeufe: { laeufe: 2, streichlaeufe: 0 }
    stichentscheid: [besterLauf]
# Regel 960, Pkt. 4.3.2: „Each driver is allowed 2 attempts, run consecutively.“ … „The jury can
# decide another starting order/system in manoeuvring.“ Wie „consecutively“ gefahren wird, ist
# je Land verschieden (Entscheidung des Nutzers vom 15.11.2026): Manche legen am Steg nur an,
# steigen nicht aus und fahren gleich noch einmal; andere fahren die Versuche wie zwei Läufe.
# Deshalb ist „Versuche direkt nacheinander“ eine Option der Veranstaltung und NICHT vorgewählt.
# Ist sie an, steht jeder Starter auf den Listen der race officials zweimal direkt nacheinander
# (1. und 2. Versuch auf einem Klassenzettel, lib/bogen.ts), und auf dem Laufzettel entfallen
# die Schritte für den Aushang dazwischen (einstellungen.yaml `laufzettel`, `zwischenaushang`).
versucheNacheinander: false
# Regel 960, Pkt. 5.2 „Results“: „All results must be signed by the O.O.D. and must show the
# time of posting.“ Unter jeder Wertungsliste (je Versuch, Gesamtliste, Einzelwertung, Mannschaftswertung)
# stehen deshalb eine Unterschriftszeile „O.O.D.“ und ein leeres Feld „Time of posting“, beides
# zum Eintragen von Hand – der gedruckte Zeitstempel daneben nennt die letzte Änderung, nicht
# den Aushang. Pkt. 5.2.1: „Manoeuvring: knots test penalties, 1st attempt times, 1st att.
# penalties, 1st att. times including penalties, 2nd attempt times, 2nd penalties, 2nd attempt
# times including penalties, best times including knots test penalties, ranking, UIM points.“
# Die Gesamtliste des Manövrierens bekommt deshalb die Spalte „UIM points“ (Tabelle unten,
# `pokal.uim.punkte`, Pkt. 5.1). Punkte stehen erst da, wenn die Klasse vollständig ist; Pkt.
# 5.1: „Drivers must complete the relevant stage and cross the finishing line in order to be
# classified for the stage.“ – wer disqualifiziert ist, hat 0 Punkte. Eine Spalte für den besten
# Versuch ohne Knoten („Result“) nennt Pkt. 5.2.1 nicht: Mit `punkte` hat die Gesamtliste sie nicht
# (Entscheidung des Nutzers vom 15.11.2026 – man sieht ihn an den gestrichenen Versuchen; auch,
# wenn die Punkte nach „Disziplin nicht werten“ entfallen; components/ErgebnisStapel.vue).
aushang: { unterschrift: true, punkte: true }

# Mannschaftswertung („team competition“). Regel 960, Pkt. 5.1 „Point system“ (S. 286): „The
# UIM pointing system to be used is: 1 - 400 points, 2 - 300, 3 - 225, 4 - 169, 5 - 127,
# 6 - 95, 7 - 71, 8 - 53, 9 - 40, 10 - 30, 11 - 22, 12 - 17, 13 - 13, 14 - 9, 15 - 7, 16 - 5,
# 17 - 4, 18 - 3, 19 - 2, 20 - 1 point. […] To be eligible for the team competition a
# National Authority must provide a minimum of five drivers. The final results for the team
# competition are determined by the points gained in the five best results of the team in the
# overall individual competitions.“ Pkt. 5.2.4: „Team competition: UIM points secured by the
# top five team members in the overall individual competitions, sum of the top five points,
# ranking of the team.“ Dieselbe Tabelle steht in Regel 317.01 und im Blatt „UIM-Points“ der
# Excel-Mappe der DM 2026.
#   vorgabe     Varianten, die eine Veranstaltung nach diesem Regelwerk eingeschaltet hat
#               (plaetze3, plaetze6 – Punkte in einstellungen.yaml – und uim).
#   uim.punkte  Punkte für die Plätze 1, 2, 3 … der Gesamtliste einer Klasse; dahinter 0.
#   uim.beste   So viele Starter je Herkunft zählen (die mit den meisten Punkten).
#   uim.mindestens  So viele Starter muss eine Herkunft stellen, um gewertet zu werden.
#   stichentscheid  Was punktgleiche Mannschaften trennt. Pkt. 5.2.6 „Dead-heat situations“:
#               „Team competition - if two or more teams end up having the same sum of UIM
#               points in the team competition, the sum of points of 1st places are added, if
#               the dead heat situation continues, the same procedure must been followed for
#               the 2nd place until a winner can be defined. This is only possible if both
#               teams have enough drivers to be taken into account. If any of the above
#               mentioned solutions would not define a winner, there will be a dead-heat
#               result.“ Also die Summe der Punkte der 1. Plätze (`zaehlt: punkte`), dann der
#               2. … ohne Grenze (`plaetze` fehlt = jeder Platz der Punktetabelle); gezählt
#               werden die Plätze aller Starter der Mannschaft, die für die Wertung zählen,
#               verglichen wird nur unter gewerteten Mannschaften. Trennt nichts: geteilter Platz.
#
# Einzelwertung („individual competition“) und ihre Rolle in der Mannschaftswertung. Pkt. 5.1:
# „The 2nd and the 3rd stage will be regarded as separate championships. At the end of the 3rd
# stage, points of the 2nd and the 3rd stage will be added up. An overall title in the individual
# competition will be awarded to the three drivers of each class who have the highest scores from
# the sum of the 2nd and the 3rd stages.“ Pkt. 5.2.3: „Individual competition / General:
# manoeuvring overall UIM points, parallel slalom overall UIM points, UIM combined points
# ranking.“ Pkt. 5.2.6: „Individual competition - if two or more drivers have the same combined
# number of points from 2nd and 3rd stage, the driver having the best combined times, i.e. the
# sum of his/her better manoeuvring attempt (including penalties) and both his/her parallel
# slalom attempts (including penalties) - will be ranked higher.“
# Gerechnet in lib/einzelwertung.ts. Welche Disziplin zählt (lib/disziplinen.ts; Entscheidungen
# des Nutzers vom 15.11.2026 – Regel 960 nennt die Fälle nicht): jede, zu der der erste Wert
# erfasst ist, in beliebiger Reihenfolge – auch nur eine von beiden, dann sind ihre Punkte die der
# Einzelwertung. Wird eine Disziplin in einer Klasse abgebrochen, zählt sie für diese Klasse
# nicht; ob sie dann auch für fertige Klassen gestrichen wird, entscheidet der O.O.D. vor Ort
# (Schalter „Disziplin nicht werten“ je Disziplin und Klasse). Die Mannschaftswertung nach
# UIM-Punkten zählt je Starter die Punkte der Einzelwertung; `uim.punkte` gilt je Disziplin. Die
# UIM points des Manövrierens gibt es erst, wenn auch die Knoten erfasst sind (Pkt. 5.2.1: „best
# times including knots test penalties, ranking, UIM points“).
# FESTLEGUNGEN zum Stichentscheid der Einzelwertung, wo Pkt. 5.2.6 nichts Näheres sagt (umstellbar
# in lib/einzelwertung.ts `EINZEL_FESTLEGUNGEN`):
#   • Der bessere Versuch des Manövrierens MIT den Strafen der Knoten (15.11.2026; Beleg, dem
#     Nutzer am 24.11.2026 erklärt: Pkt. 4.3 „Manoeuvring consists of: Tying knots (point 4.3.1);
#     Driving on the manoeuvring racecourse (point 4.3.2)“, Pkt. 5.2.1 „best times including knots
#     test penalties“ – die Knoten gehören zum Manövrieren).
#   • Parallelslalom (Entscheidung des Nutzers vom 24.11.2026, ersetzt „die beiden Attempts des
#     Vorlaufs“ vom 15.11.2026; `letzteDannVorletzte`): je Punktgleichem die Summe beider Attempts
#     SEINER zuletzt gefahrenen Runde (Finale, Kleines Finale, Halbfinale oder Vorlauf); ist auch
#     die Zeit gleich, die seiner vorletzten gefahrenen Runde. Ein Re-run ersetzt die Zeiten der
#     wiederholten Runde („After running again only the time of the re-run will be taken into
#     account.“). Was als „gefahren“ zählt: lib/einzelwertung.ts gefahreneRunden.
# Wem für den Stichentscheid eine Zeit fehlt, weil er disqualifiziert ist, steht hinter den
# Punktgleichen mit Zeit (15.11.2026: eine Disqualifikation ist eine Wertung, letzter Platz unter
# den Punktgleichen); mehrere solche teilen sich diesen Platz. Die „1st places“ des
# Stichentscheids der Mannschaften sind die der Einzelwertung, dann die „2nd places“ usw.
pokal:
  vorgabe: [uim]
  stichentscheid: { zaehlt: punkte }
  uim:
    punkte: [400, 300, 225, 169, 127, 95, 71, 53, 40, 30, 22, 17, 13, 9, 7, 5, 4, 3, 2, 1]
    beste: 5
    mindestens: 5

# Laufzettel: Abweichung von der Vorgabe (einstellungen.yaml `laufzettel`) für den Zettel des
# letzten Versuchs. Regel 960, Pkt. 5.2 „Results“: „Results for each class and stage must be
# posted as soon as possible (and never more than 1 (one) hour after the last driver of that
# class has finished the relevant stage) in a clearly visible place (as announced in the
# drivers meeting). All results must be signed by the O.O.D. and must show the time of
# posting.“ Mit dem letzten Versuch ist die Stage (Manövrieren) der Klasse beendet: Der Zettel
# bekommt deshalb den Schritt für den Aushang binnen einer Stunde, mit Unterschrift des O.O.D.
# und Uhrzeit des Aushangs. Der Schritt der DM „Einsicht der Mannschaftsleiter (kein Aushang)“
# (Reglement C6) entfällt hier – die UIM verlangt den Aushang; ebenso das allgemeine
# „Unterschrieben“, das im neuen Schritt aufgeht. Die Zettel der übrigen Versuche folgen der Vorgabe.
laufzettel:
  schritteLetzterLauf:
    - "Wertungsliste sortiert nach Startnummer drucken (geheftet mit den WKR-Listen)"
    - "Wertungsliste sortiert nach Platz"
    - "Kontrolliert"
    - text: "Ergebnisse vom O.O.D. unterschrieben und ausgehängt – höchstens 1 Stunde nach dem letzten Fahrer der Klasse, mit Uhrzeit des Aushangs (Regel 960, Pkt. 5.2)"
      en: "Results signed by the O.O.D. and posted – not more than 1 (one) hour after the last driver of the class has finished, showing the time of posting (rule 960, pt. 5.2)"
    - "Gesamtergebnis gedruckt"
    - "Gesamtergebnis kontrolliert"

fehlerHinweis: "Fehler sind kombinierbar: Jeder eingetragene Code zählt einzeln, die Sekunden werden addiert (2. und 3. Versuch: Code ist zweimal eintragbar, z. B. 2x6)."
fehlerHinweisEn: "Penalties can be combined: every code entered counts separately and the seconds are added (2nd and 3rd attempt: the code can be entered twice, e.g. 2x6)."

legendeHinweise:
  - { text: "Strafzeiten in Sekunden werden zur gefahrenen Zeit addiert.", en: "Penalty seconds are added to the time driven." }
  - { text: "Mann-über-Bord fahren nur die Klassen 4 und 5.", en: "Only classes 4 and 5 perform the man-over-board manoeuvre." }

# Regel 960, Pkt. 4.3.1: „Every driver must show his/her skill in tying the following knots
# (see addendum): Reef knot; Bowline; Half-hitch; Clove-hitch. The maximum time limit for
# tying each knot is 60 seconds, beyond which the knot will be considered as improperly done.“
# Pkt. 5.3: „Improperly done knot (each) 5 seconds“. Also vier Knoten – Kreuzknoten (Reef
# knot), Palstek (Bowline), Webleinstek (Clove hitch) und Klampe (Half hitch; die Zeichnung
# im Anhang, S. 288, zeigt ihn an einer Klampe) – für jede Klasse dieselben („every driver“,
# keine Abstufung nach Klasse). Der Schotstek der DM fehlt; mit dem Regelbuch (Fassung vom
# 28.05.2026) abgeglichen am 14.11.2026.
ohneSpalten:
  knoten: [schotstek]

# Pkt. 5.3 nennt nur diese Disqualifikationen, ausdrücklich keine für Quickstopp
# oder Ausrüstung (dort Startbedingung, Pkt. 2), Überfahren einer Boje oder
# Berührung der Zeitmessanlage (Pkt. 3.10: schwarze Flagge).
disqualifikationen:
  - { code: "D", text: "4. Versuch", en: "4th attempt of the racecourse", bereiche: [steg, parcours, mueb] }
  - { code: "E", text: "Sitzen auf dem Schlauch oder Bending", en: "Sitting on the side of the inflated boat, or bending", bereiche: [steg, parcours, mueb] }
  - { code: "F", text: "Stehen beim Manövrieren oder Parallelslalom", en: "Standing during manoeuvring or parallel slalom", bereiche: [steg, parcours, mueb] }
  - { code: "J", text: "Fehler im Parcours (außer den oben genannten)", en: "Error doing the circuit (except above mentioned ones)", bereiche: [parcours, mueb] }
  - { code: "Q", text: "Rückwärtsfahren beim Mann-über-Bord", en: "Boat goes backwards during the man-over-board manoeuvre", bereiche: [mueb] }
  - { code: "X", text: "Nicht gestartet", en: "Did not start" }

direktpunkte:
  - { titel: "Bojen", titelEn: "Buoys", text: "Bojenberührung", en: "Touching of a buoy", punkte: 5 }
  - { titel: "Knoten", titelEn: "Knots", text: "Pro fehlerhaftem Knoten (max. 60 Sekunden je Knoten)", en: "Improperly done knot, each (max. 60 seconds per knot)", punkte: 5 }

# `max` / `danach` (Nutzer 24.11.2026, wie dm-2026.yaml): „2nd and 3rd attempt“ höchstens 2×, der Tipp danach setzt
# D „4th attempt of the racecourse“ (Regel 960, Pkt. 5.3); Tor 5 Code 1 höchstens 1×. Ohne `max`: allgemeine Grenze
# WKR_ANNAHMEN.codeMaxAllgemein.
kataloge:
  stegAblegen:
    titel: "Ablegen (AB)"
    titelEn: "Leaving the starting pontoon"
    fehler:
      - { code: 3, text: "erneute Stegberührung", en: "Additional touch of the starting pontoon", punkte: 5 }
      - { code: 6, text: "2. und 3. Versuch des Elementes (je Versuch)", en: "2nd and 3rd attempt each element of the race course (each attempt)", punkte: 5, max: 2, danach: D }

  stegAnlegen:
    titel: "Anlegen (AN)"
    titelEn: "Mooring"
    fehler:
      - { code: 7, text: "2. und 3. Versuch des Elementes (je Versuch)", en: "2nd and 3rd attempt each element of the race course (each attempt)", punkte: 5, max: 2, danach: D }
      - { code: 9, text: "Stegberührung mit Zurückprallen (über 300 mm innerhalb 1 Sekunde)", en: "Bumping the landing pontoon (bounces back more than 300 mm within 1 second, Pt. 4.1.1)", punkte: 5 }
      - { code: 11, text: "Rückwärtsfahren auf dem Weg zum Steg", en: "Driving backwards during moving to the pontoon", punkte: 5 }
      - { code: 12, text: "Boot nicht im Stillstand, obwohl Hände außerhalb des Bootes", en: "Boat did not stop at the landing pontoon when the driver put the hands out of the boat", punkte: 10 }

  tor5:
    titel: "Einfahrt Tor 5:"
    titelEn: "Entering gate 5:"
    fehler:
      - { code: 1, text: "nicht mit gesamter Länge durchs Tor gefahren", en: "Not passing the gate with the full length of the boat", punkte: 20, max: 1 }
      - { code: 20, text: "2. und 3. Versuch des Elementes (je Versuch)", en: "2nd and 3rd attempt each element of the race course (each attempt)", punkte: 5, max: 2, danach: D }

  # Die UIM führt alle Punkte einzeln auf (auch Auflegen und Fallenlassen).
  mueb:
    titel: "Fehler (MüB):"
    titelEn: "Penalties (man-over-board):"
    fehler:
      - { code: 14, text: "Rettungsring mit einer Hand gehoben", en: "Rising the safety belt with one hand", punkte: 5 }
      - { code: 15, text: "Rettungsring mit einer Hand abgelegt", en: "Putting down the safety belt with one hand", punkte: 5 }
      - { code: 17, text: "Boot an der Marke nicht gestoppt", en: "Boat did not stop at the mark during the man-over-board manoeuvre", punkte: 5 }
      - { code: 18, text: "Rettungsring nicht über den Kopf gehoben", en: "Not rising the safety belt above the head (i.e. lower than driver's head)", punkte: 5 }
      - { code: 19, text: "2. und 3. Versuch des Elementes (je Versuch)", en: "2nd and 3rd attempt each element of the race course (each attempt)", punkte: 5, max: 2, danach: D }
      - { code: 21, text: "Rettungsring fallengelassen oder geworfen", en: "Dropping or throwing the safety belt on the mark", punkte: 5 }
      - { code: 22, text: "Zweiter Versuch, den Rettungsring zu heben", en: "Second attempt to raise the lifebuoy", punkte: 5 }
