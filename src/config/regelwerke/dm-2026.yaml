# =====================================================================
# Regelwerk DM 2026
# =====================================================================
# Quelle: Reglement zur Deutschen Jugendmeisterschaft 2026 im motorisierten Schlauchbootsport
# (DMYV, Referat Jugend & Sport), Abschnitte A2, C1 bis C8. Seitenangaben in den Kommentaren
# beziehen sich auf dieses Reglement. Mit dem Wortlaut abgeglichen am 14.11.2026; was dabei
# abweicht und nicht geändert wurde, steht am jeweiligen Eintrag.
#
# Das Reglement kennt weder Buchstaben noch Nummern für Fehler und Disqualifikationen: Die
# Codes sind die der Auswertung (aus dem Fehlerpunkte-Prototyp); die Texte folgen C5.
#
# Ein Regelwerk enthält alles, was aus der AUSSCHREIBUNG kommt. Die Positionen
# (aufbauten/*.yaml) sind orts-/personenabhängig und binden die Kataloge und die
# Disqualifikationen per Verweis ein. Neue Version: Datei kopieren, `id` und
# `version` anpassen, in regelwerke.yaml eintragen.
#
#   id               Eindeutig, entspricht dem Dateinamen.
#   name, version    Anzeige im Menü und auf den Listen, z. B. „DM 2026“.
#   quelle           Dokument, aus dem die Werte stammen (A4-Legende).
#   einheit          Punkte | Sekunden (A4-Legende).
#   klassen          Klassen dieses Regelwerks.
#   sprachen         Sprachen, in denen es die Texte gibt: [de] (Vorgabe) oder [de, en].
#   listenSprache    Sprache aller Listen außer den Wettkampfrichter-Bögen (Starter-,
#                    Gewichts-, Vorsteg-, Wertungslisten, Laufzettel, Aushang der Codes):
#                    Der Aushang folgt dem Regelwerk, nicht der Sprache der Oberfläche.
#                    Eine der `sprachen`; fehlt = die erste. Für die Bögen ist es die
#                    Vorgabe – dort wählt die Veranstaltung je Liste.
#   laenderKuerzel   Dreistellige Kürzel der Länder auf den Listen: ioc (Kürzel des
#                    IOC, GER, SUI) oder iso (ISO 3166-1, DEU, CHE – Vorgabe, wenn die
#                    Angabe fehlt). Eigene Kürzel der Veranstaltung gehen immer vor.
#   fehlerHinweis   Steht auf jeder Liste mit Fehlercodes und auf der A4-Legende.
#   legendeHinweise  Zusätzliche Hinweise nur auf der A4-Legende.
#   disziplinen      Was nach diesem Regelwerk gefahren wird (Kennungen aus den
#                    Aufbauten). Die DM kennt nur das Manövrieren.
#   gewichte         Statistisches Durchschnittsgewicht je Klasse in kg. Wer leichter
#                    ist, bekommt den Unterschied als Ausgleichsgewicht ins Boot.
#   coPilot          Klassen, in denen ein Co-Pilot an Bord sein muss: Für sie hat die
#                    Besetzung (Ansicht „Veranstaltung“) ein Feld, und die Liste der
#                    Ausgleichsgewichte nennt ihn im Kopf. Fehlt = keine.
#   ohneSpalten      { <Position>: [<Spalten-Key>, …] }: Spalten, die es in diesem
#                    Regelwerk nicht gibt (z. B. einzelne Knoten).
#   stichentscheid   Was bei gleichem Ergebnis entscheidet, der Reihe nach – in der
#                    Liste eines Laufs wie in der Gesamtliste. Trennt keines (oder
#                    fehlt die Angabe), teilen sich die Starter den Platz.
#                      schnellsterLauf   die kürzeste gefahrene Zeit (ohne Strafpunkte)
#                                        unter den gewerteten, nicht gestrichenen Läufen
#                      besterLauf        das beste Ergebnis (Zeit und Strafpunkte)
#                                        unter den gewerteten Läufen
#                      summeAllerLaeufe  die Summe aller Läufe mit Strafpunkten, auch
#                                        der gestrichenen; wer nicht in jedem Lauf ein
#                                        gültiges Ergebnis hat, steht dahinter
#   vorgabeListen    { <Disziplin>: [<Position>, …] }: Listen, die das Regelwerk in
#                    jedem Aufbau der Disziplin vorsieht – Positionen mit
#                    `schnellauswahl: true`. Nennt ein Aufbau sie nicht selbst, kommen
#                    sie als zusätzliche Liste dazu. Es ist eine Vorgabe – unter
#                    „Einstellungen → Wettkampfrichter-Listen“ lässt sie sich abwählen.
#   pokal            { vorgabe: [<Variante>, …], uim?: { punkte, beste, mindestens } }:
#                    Mannschaftswertung je Herkunft. `vorgabe` nennt die Varianten, die eine
#                    Veranstaltung nach diesem Regelwerk eingeschaltet hat (plaetze3,
#                    plaetze6, uim). `uim` trägt die Punktetabelle der UIM-Variante – sie
#                    steht nur im Regelwerk der UIM und gilt auch, wenn die Variante
#                    unter einem anderen Regelwerk eingeschaltet wird.
#   wertungslaeufe   { laeufe, streichlaeufe, nurVorgabe? }: So viele Läufe sieht das
#                    Regelwerk vor und so viele davon werden gestrichen. Die Wahl des
#                    Regelwerks stellt die Veranstaltung so ein; wer von Hand davon
#                    abweicht, bekommt einen Hinweis. Mit `nurVorgabe: true` ist es nur
#                    die Voreinstellung – ohne Hinweis bei Abweichung. `nachRegel`
#                    { Läufe: Streichläufe }: was die Einstellung „Streichläufe nach
#                    Regel“ bei dieser Zahl von Läufen streicht; sonst ab 3 Läufen einer.
#   startabstaende   { <Klasse>: <Sekunden> }: Startabstände für die Prognose im Betrieb
#                    (ganze Sekunden, 30 bis 600). Ersetzt je Klasse die allgemeinen aus
#                    einstellungen.yaml; fehlt = die allgemeinen. Weder DM noch UIM nennen
#                    bisher eigene – die allgemeinen stammen aus der DM 2025.
#   startNrBereiche  { <Klasse>: [{ von, bis, gruppe }] }: Nummernbereiche der Startnummern
#                    nach Größengruppe der Westen (S-M, L-XL, XXL), wie auf den Westen
#                    geschrieben. Vorgabe der klassenbasierten Vergabe; fehlt = fortlaufend.
id: dm-2026
name: DM
version: 2026
# Die DM schreibt deutsch aus; englische Texte hat dieses Regelwerk nicht (`sprachen` fehlt).
listenSprache: de
# Länder mit dem Kürzel des IOC (GER, SUI, NED) wie unter der UIM, nicht nach ISO (DEU, CHE …):
# Der Verband gehört zum Olympischen Sportbund (Entscheidung des Nutzers vom 15.11.2026; vorher
# ISO 3166-1, Festlegung vom 12.11.2026). Die Bundesländer behalten ihre Kürzel (BY, NW …).
laenderKuerzel: ioc
quelle: "Reglement zur Deutschen Jugendmeisterschaft 2026 im motorisierten Schlauchbootsport (DMYV), Abschnitt C5"
einheit: Punkte
# Reglement C8 „Klassen“: Klasse ME 6 und 7 Jahre, Klasse 1 8 und 9, Klasse 2 10 und 11,
# Klasse 3 12 und 13, Klasse 4 14 bis 15, Klasse 5 16 bis 18, Klasse 6 19 bis 21, Klasse 7
# 22 bis 27 Jahre. „Berechnung der Altersklasse = Veranstaltungsjahr – Geburtsjahr“ – so
# rechnet domain/classes.ts. Nicht umgesetzt ist die Ausnahme dort: „Klasse ME Starterlaubnis
# versicherungsbedingt ab dem 6. Geburtstag und Klasse M7 Starterlaubnis bis zum 27.
# Geburtstag“ (das Programm prüft keinen Stichtag am Wettkampftag). Die jüngste Klasse heißt
# im Reglement „ME“ (C8 „Klasse ME“, im Text „ME bis M3“); hier trägt sie die Kennung E, und
# die Listen schreiben „Klasse E“ – Entscheidung des Veranstalters: „Das M bei der E ist ein
# Überbleibsel“. Deshalb steht hier bewusst kein `klassenNamen` (unter UIM: { E: Dolphin }).
klassen: [E, 1, 2, 3, 4, 5, 6, 7]
# Was vor der laufenden Nummer einer klassenbezogenen Startnummer steht (E01, 101 …). Ohne
# Angabe ist es die Kennung der Klasse; für die Klasse E steht der Buchstabe hier ausdrücklich.
startNrPraefix: { E: E }
# Startnummern nach Größe der Westen (nur bei klassenbasierten Nummern): Je Klasse gehört ein
# Nummernbereich zu einer Größengruppe (S-M, L-XL, XXL; XS zählt zu S-M, XXXL zu XXL). Quelle:
# DMYV-Startnummernliste, vom Nutzer als Foto übergeben am 19.11.2026 – Vorgabe, je Veranstaltung
# änderbar (Einstellungen → Startnummern). Die Nummern sind so geschrieben, wie sie auf den Westen
# stehen. Bestätigt vom Nutzer (20.11.2026): Klasse E ist E01–E30 (auf dem Zettel stand
# versehentlich E101–E130); die Klassen E bis 3 haben nur S–M, erst ab Klasse 4 ist nach Größen
# aufgeteilt; Klasse 7 wie gelesen. L/XL-Starter der Klassen E–3 weichen nach der Regel aus
# (domain/startnrBereiche.ts ausweichFolge).
startNrBereiche:
  E: [{ von: E01, bis: E30, gruppe: S-M }]
  1: [{ von: 101, bis: 130, gruppe: S-M }]
  2: [{ von: 201, bis: 230, gruppe: S-M }]
  3: [{ von: 301, bis: 330, gruppe: S-M }]
  4: [{ von: 401, bis: 420, gruppe: S-M }, { von: 421, bis: 430, gruppe: L-XL }]
  5: [{ von: 501, bis: 510, gruppe: S-M }, { von: 511, bis: 528, gruppe: L-XL }, { von: 529, bis: 530, gruppe: XXL }]
  6: [{ von: 601, bis: 610, gruppe: S-M }, { von: 611, bis: 625, gruppe: L-XL }, { von: 626, bis: 630, gruppe: XXL }]
  7: [{ von: 701, bis: 710, gruppe: S-M }, { von: 711, bis: 725, gruppe: L-XL }, { von: 726, bis: 730, gruppe: XXL }]
disziplinen: [manoevrieren]
# Reglement C3 „Co-Pilot und Gewichte“, Tabelle „Stat. Durchschnittsgewicht“: „Jugendliche,
# deren Körpergewicht geringer als das statistische Durchschnittsgewicht der folgenden Tabelle
# ist, erhalten ein Ausgleichsgewicht ins Boot so, dass die Summe aus Körpergewicht und
# Ausgleichsgewicht gleich dem statistischen Durchschnittsgewicht ist.“
gewichte: { E: 26, 1: 33, 2: 42, 3: 52, 4: 65, 5: 72, 6: 75, 7: 78 }
# Reglement C3: „In den Klassen ME bis M3 muss ein mindestens 16-jähriger Co-Pilot an Bord
# sein“. Dazu: „Bei wechselnden Co-Piloten innerhalb einer Klasse ist durch Ausgleichsgewichte
# sicherzustellen, dass das Gesamtgewicht in der jeweiligen Klasse und jedem Lauf gleich ist.“
coPilot: [E, 1, 2, 3]
# Reglement C5 „Wertung“: „Bei Punktgleichheit entscheidet der schnellste gewertete Lauf.“
# „Schnellster“ ist als gefahrene Zeit gelesen (vom Veranstalter bestätigt) – soll das
# Ergebnis des Laufs samt Strafpunkten gelten, steht hier `besterLauf`. Was gilt, wenn auch
# das nicht trennt, sagt das Reglement nicht: Die Starter teilen sich den Platz.
stichentscheid: [schnellsterLauf]
# Reglement C5 e) „Fertigen der Knoten“: „Der Nachweis über die Fertigung der Knoten, gemäß
# der Knotenbilder, muss innerhalb von 60 Sekunden je Knoten erbracht werden.“ Genannt sind
# fünf – Kreuzknoten, Palstek, Schotstek, Webeleinstek, Belegen der Klampe –, ohne Abstufung
# nach Klasse; „pro fehlerhafter Knoten 05 Punkte“. Das sind die fünf der Position `knoten`
# (aufbauten/gemeinsam.yaml; dort „Webleinstek“ und „Klampe“ geschrieben – das Reglement
# schreibt „Webeleinstek“, in der Anlage „Webeleinenstek“ und „Belegen einer Klampe“), für
# jede Klasse dieselben (weder `ohneSpalten` noch `klassen` an den Knoten). Die Knoten-Liste
# gehört deshalb zu jedem Aufbau, wird erfasst und steht in der Gesamtliste. Zu welchem Lauf
# die Knotenpunkte zählen, sagt das Reglement nicht; sie zählen hier zum Gesamtergebnis.
vorgabeListen: { manoevrieren: [knoten] }
# Reglement C5: „Sieger ist der Starter mit der geringsten Punktzahl von 2 Läufen. […] Es
# werden pro Klasse drei Läufe durchgeführt, wobei der schlechteste Lauf gestrichen wird.“
# C6: „Es bleibt dem Regattaleiter und dem Schiedsgericht vorbehalten, nur zwei Läufe,
# durchzuführen, von denen nur ein Lauf gewertet wird.“ Abschnitt C (Einleitung): Das
# Reglement soll auch für Landes- und Clubmeisterschaften gelten, „in begründeten Fällen kann
# davon abgewichen werden“. Die Wahl des Regelwerks stellt die Veranstaltung auf drei Läufe
# und einen Streichlauf. `nurVorgabe`: Weil das Reglement selbst zwei Läufe und begründete
# Abweichungen zulässt, meldet die Oberfläche eine andere Zahl nicht als Abweichung.
# `nachRegel: { 2: 1 }` setzt C6 um: Werden nur zwei Läufe gefahren, streicht die Einstellung
# „Streichläufe nach Regel“ einen („von denen nur ein Lauf gewertet wird“). Von Hand lässt sich
# weiter jede Zahl einstellen (Abbruch wegen Unwetter: Läufe und Streichläufe frei wählbar) –
# wegen `nurVorgabe` ohne Hinweis auf eine Abweichung.
# Nicht abgebildet (Entscheidung der Regattaleitung, keine Rechenregel) – C5: Bei technischem
# Defekt und Ersatzboot/-motor „ist der Lauf nur dann zu wiederholen, wenn weniger als 2/3 der
# Teilnehmer in dieser Klasse gestartet sind. In allen anderen Fällen wird mit dem Ersatzboot
# oder Ersatzmotor/Ersatzschaltung weitergefahren.“ Die Auswertung zählt die Gestarteten einer
# Klasse nicht mit und warnt nicht.
# C7: „Feststellungen von Ergebnisfehlern (Eingabefehler, Schreibfehler, Rechenfehler) nach
# Beendigung der Deutschen Jugendmeisterschaft, sind innerhalb einer Frist von 7 Tagen nach
# Veranstaltungsende an den Regattaleiter zu richten“. Das betrifft die Druckdatei, die nach
# dem Wettkampf verschickt wird: Sie nennt die Frist nicht; den Versand selbst verlangt das
# Reglement nicht.
wertungslaeufe: { laeufe: 3, streichlaeufe: 1, nurVorgabe: true, nachRegel: { 2: 1 } }
# Mannschaftswertung (je Verein oder Bundesland; im Code „pokal“). Reglement C6
# „Länderwertung“: „Um an der Länderwertung teilzunehmen, muss ein Land mindestens fünf Fahrer
# haben. Die UIM-Punkte, eingefahren von den besten fünf Piloten jedes Teams, werden für die
# Mannschaftswertung addiert. Der Landesverband mit der höchsten Punktzahl gewinnt. Bei
# Gleichstand zählt die Anzahl der 1. Plätze. Sollte weiterhin gleichstand bestehen, wird mit
# den Plätzen 2 und 3 ebenso verfahren.“ Das ist die Variante `uim`; eine eigene Punktetabelle
# nennt das Reglement nicht – es gilt die der UIM (uim-2026.yaml, `pokal.uim`: Regel 960,
# Pkt. 5.1), mit denselben Zahlen (fünf Beste, mindestens fünf).
# Die Wertung nach Plätzen (`plaetze6`: die ersten sechs je Klasse mit 6, 5, 4, 3, 2, 1
# Punkten; einstellungen.yaml `pokalPunkte`) steht nicht im Reglement: Sie stammt aus der
# Excel-Mappe der DM 2026, die beide Blätter druckt – deshalb sind beide die Vorgabe.
# `stichentscheid`: C6 „Bei Gleichstand zählt die Anzahl der 1. Plätze. Sollte weiterhin
# gleichstand bestehen, wird mit den Plätzen 2 und 3 ebenso verfahren.“ – also die Zahl der
# Plätze (`zaehlt: anzahl`) bis Platz 3 (`plaetze: 3`). Gezählt werden die Plätze aller Starter
# der Mannschaft, die für die Wertung zählen. Trennt auch das nichts, teilen sich die
# Mannschaften den Platz. Die Regel gilt für jede eingeschaltete Variante, auch für die nach
# Plätzen (für die das Reglement nichts sagt).
pokal:
  vorgabe: [plaetze6, uim]
  stichentscheid: { zaehlt: anzahl, plaetze: 3 }

fehlerHinweis: "Fehler sind kombinierbar: Jeder eingetragene Code zählt einzeln, die Punkte werden addiert (2. und 3. Versuch: Code ist zweimal eintragbar, z. B. 2x6)."

# Reglement C5: „Die gefahrene Zeit wird innerhalb der Zeitmessung pro Sekunde mit einem Punkt
# bewertet. Strafpunkte werden hinzugezählt.“ Eine Auflösung oder Rundung der Zeit nennt das
# Reglement nicht (gerechnet wird in Hundertstel, lib/ergebnis.ts).
legendeHinweise:
  - "Die gefahrene Zeit zählt 1 Punkt pro Sekunde, Strafpunkte werden hinzugezählt."
  - "E, F und H gelten ab der Frage „Bist Du startklar?“ bis zum beendeten Anlegemanöver."
  - "M gilt von der Stegeinlass- bis zur Stegauslasskontrolle."

# ---- Disqualifikationen (Buchstaben-Codes) -------------------------
# Reglement C5, Liste nach g) (S. 14): „Alle Verstöße gegen diese Ausschreibung, die nicht
# durch Strafpunkte belegt sind, führen zur Disqualifikation. Dazu zählen: …“, dazu die mit
# „Disq.“ bezeichneten Zeilen in b), c), d) und f) und C4 (Sitzen auf dem Schlauch).
# Abgeglichen: A, K (Quickstopp), M (Ausrüstung), G, N, P, J, C, D, F, H, E, B (Liste S. 14),
# I (d: „Anlegen mit der Backboard-Seite Disq.“), Q (f: „Rückwärts gefahren Disq.“). Aus der
# allgemeinen Regel abgeleitet, im Reglement ohne eigene Zeile: L (f: „Seitliches Anfahren der
# Boje an der Backbordseite“), R (C3), S (d: „Ein Bremsen mit der Hand ist nicht zulässig.“ –
# Entscheidung des Nutzers vom 15.11.2026: eigener Buchstabe, nur auf der Steg-Liste). X ist
# kein Verstoß, sondern der Vermerk der Auswertung.
# Ebenfalls ohne Buchstaben, weil es nicht den einzelnen Lauf betrifft – B7
# „Verantwortlichkeit“: „Ein positives Alkohol-Ergebnis (> bei Alkohol 0,2 Promille) führt zur
# Disqualifikation für den gesamten Wettkampftag. Ein positives Drogen-Ergebnis […] führt zur
# Disqualifikation für den gesamten Wettkampf.“ Die Auswertung kennt dafür keinen Code (X heißt
# nur „nicht gestartet“); einzutragen wäre heute je Lauf ein Disqualifikations-Buchstabe.
# Je Punkt der Ausschreibung ein eigener Buchstabe. Das O ist bewusst nicht
# vergeben: In Bojen-Zellen stehen auch Zahlen, dort wäre es mit der 0 zu
# verwechseln.
#
# `bereiche` legt fest, auf welchen Listen der Buchstabe steht (Position →
# `disq: <Bereich>`). Fehlt die Angabe, gilt er überall.
#   vorsteg   Vorsteg (an Land, bevor die Starter den Steg betreten)
#   steg      Steg (Ablegen / Anlegen)
#   parcours  Tore, Tor 5 und Parcours
#   mueb      Listen mit Mann-über-Bord
disqualifikationen:
  - { code: "A", text: "Fahren ohne Quickstopp", bereiche: [steg, parcours, mueb] }
  - { code: "B", text: "Berührung Start-/Ziel-Tor bzw. Zeitmessanlage (nicht die Bojen)", bereiche: [parcours, mueb] }
  - { code: "C", text: "Rückwärtsfahren ab/bis Start-/Ziel-Tor (außer ins Tor 5 bei Klasse 2 bis 7)", bereiche: [steg, parcours, mueb] }
  - { code: "D", text: "4. Versuch eines Elementes", bereiche: [steg, parcours, mueb] }
  - { code: "E", text: "Sitzen auf dem Schlauch (kein Knie auf dem Bootsboden, Gesäß auf dem Süllrand)", bereiche: [steg, parcours, mueb] }
  - { code: "F", text: "Stehen im Boot, auch in gebückter Haltung (außer zum Anreißen des Motors)", bereiche: [steg, parcours, mueb] }
  - { code: "G", text: "Überfahren einer Boje (unter die Wasseroberfläche gedrückt oder abgerissen; MüB: Stange vollständig auf dem Wasser)", bereiche: [parcours, mueb] }
  # Bewusst genauer als die Ausschreibung: Der Süllrand liegt bei den eingesetzten
  # Booten woanders als üblich. Die Beschreibung wird so ins nächste Reglement
  # übernommen.
  - { code: "H", text: "\"Bending\" Herauslehnen über Bootsbreite hinaus (außer bei MüB und An/Ablegen)", bereiche: [steg, parcours, mueb] }
  - { code: "I", text: "Anlegen mit der Backbordseite", bereiche: [steg] }
  - { code: "J", text: "Falscher Parcours entgegen der Parcourszeichnung", bereiche: [parcours, mueb] }
  - { code: "K", text: "Abnehmen des Quickstopps während der Fahrt oder bei Manövern (außer Motorstart mit Schaltung im Leerlauf)", bereiche: [steg, parcours, mueb] }
  - { code: "L", text: "Anfahren MüB oder Ablegen des Ringes an Steuerbord", bereiche: [mueb] }
  - { code: "M", text: "Nicht funktionsgerechtes Tragen von Rettungsweste, Helm, Schuhwerk oder Startnummer" }
  - { code: "N", text: "Auslassen eines Bojentores bzw. des Ziel-Tores", bereiche: [parcours, mueb] }
  - { code: "P", text: "Wiederholtes Anfahren eines Tores (außer MüB und Tor 5) / Vollkreis vor Tor 5", bereiche: [parcours, mueb] }
  - { code: "Q", text: "Rückwärtsfahren beim MüB", bereiche: [mueb] }
  # Abschnitt C3 verbietet die Hilfe, S. 14 macht jeden Verstoß ohne Strafpunkte zur
  # Disqualifikation. Ausnahmen laut C3: Motorstart und Abweichung vom Ablauf.
  - { code: "R", text: "Hilfestellung des Co-Piloten beim Ab-/Anlegen oder bei Manövern (außer Motorstart und wenn der Ablauf gestört ist)", bereiche: [steg, parcours, mueb] }
  # Reglement C5 d) Anlegen: „Das Boot muss im Anlegebereich komplett zum Stillstand gebracht
  # werden. Ein Bremsen mit der Hand ist nicht zulässig.“ Dafür nennt d) keine Strafpunkte, also
  # gilt die Liste nach g) (S. 14): „Alle Verstöße gegen diese Ausschreibung, die nicht durch
  # Strafpunkte belegt sind, führen zur Disqualifikation.“ Beobachtet wird es am Steg.
  - { code: "S", text: "Bremsen mit der Hand beim Anlegen", bereiche: [steg] }
  - { code: "X", text: "Nicht gestartet" }

# ---- Fehler ohne Code (Punkte werden direkt eingetragen) -----------
# Reglement C5 b): „Bojen Berührung mit dem Sportgerät je Boje und je Fahrtrichtung 5 Punkte“;
# c): „Berühren der Torbojen mit dem Sportgerät bei An-, Ein- und Ausfahrt je Boje und
# Berührung 05 Punkte“; e): „pro fehlerhafter Knoten 05 Punkte“.
direktpunkte:
  - { titel: "Bojen", text: "Bojenberührung je Boje und je Fahrtrichtung", punkte: 5 }
  - { titel: "Tor 5", text: "Berühren der Torbojen bei An-, Ein- und Ausfahrt je Boje und Berührung", punkte: 5 }
  - { titel: "Knoten", text: "Pro fehlerhaftem Knoten (max. 60 Sekunden je Knoten)", punkte: 5 }

# ---- Fehler-Kataloge (Zahlen → Punkte), benannt & wiederverwendbar --
# Reglement C5 a) Ablegen, c) Tor 5, d) Anlegen, f) Mann-über-Bord, g) Umgang mit dem
# Sportgerät; alle Punktzahlen abgeglichen. Aus g) stammen in jedem Katalog „Durchreißen der
# Schaltung“ (Reglement: „Schalten entgegen obiger Definition 05 Punkte“, „gewertet wird dies
# ab der Klasse M4“) und „Treten auf den Schlauch (ab Klasse M3) 5 Punkte“.
# Die Katalog-IDs (tor5, mueb, stegAblegen, stegAnlegen) verwenden die Positionen;
# jedes Regelwerk muss sie anbieten. Die Codes sind über alle Kataloge eindeutig.
kataloge:
  # Steg getrennt nach Ablegen (AB) und Anlegen (AN) - jede Spalte lässt nur
  # ihre eigenen Codes (und Disqualifikationen) zu.
  stegAblegen:
