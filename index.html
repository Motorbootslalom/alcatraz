<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Cg transform='translate(12 12) scale(.76)'%3E%3Cpath d='M50 10 L88 88 H70 L50 44 L30 88 H12 Z' fill='%23fff'/%3E%3Cpath d='M6 68 q 11 -10 22 0 t 22 0 t 22 0 t 22 0' fill='none' stroke='%230f766e' stroke-width='13'/%3E%3Cpath d='M6 68 q 11 -10 22 0 t 22 0 t 22 0 t 22 0' fill='none' stroke='%2399f6e4' stroke-width='6' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Alcatraz – Motorbootslalom</title>
    <!-- Hell/Dunkel und Farbschema vor dem ersten Bild setzen, sonst blitzt die helle Fassung auf (Logik: src/lib/theme.ts). -->
    <script>
      try {
        var m = localStorage.getItem('alcatraz:ui-mode')
        var d = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.mode = d ? 'dark' : 'light'
        document.documentElement.dataset.scheme = localStorage.getItem('alcatraz:ui-scheme') || 'steg'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
